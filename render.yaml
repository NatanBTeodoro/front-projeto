databases:
  - name: pizzaria-db
    databaseName: pizzaria
    user: pizzaria
    plan: free
    region: oregon

services:
  - type: web
    name: pizzaria-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./pizzaria/Dockerfile
    dockerContext: ./pizzaria
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PGHOST
        fromDatabase: { name: pizzaria-db, property: host }
      - key: PGPORT
        fromDatabase: { name: pizzaria-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: pizzaria-db, property: database }
      - key: PGUSER
        fromDatabase: { name: pizzaria-db, property: user }
      - key: PGPASSWORD
        fromDatabase: { name: pizzaria-db, property: password }
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # o Render pede o valor na criação